name: CI

# Deliverable #6 asks for the CI pipeline script, and the "Code quality and CI"
# rubric row rewards a pipeline that reliably builds AND tests the system.
#
# Two jobs for now, matching what actually exists in the repo. Once you commit
# migrations under supabase/migrations/, add a third job that runs
# `supabase start` + `supabase db reset` and your integration tests against it -
# building the schema from scratch in CI is what proves a fresh clone runs.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Throwaway build-time values. The build must not depend on real
      # credentials, and no secret belongs in a workflow file - put real values
      # in GitHub repository secrets if a job ever needs them.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-service-key
